# Gerenciado por mvnulman/repo-policy
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, build and test
        shell: bash
        env:
          ENFORCE_TESTS: ${{ vars.ENFORCE_TESTS || 'false' }}
        run: |
          set -euo pipefail
          found=0

          run_optional_test() {
            if "$@"; then
              return 0
            fi
            if [ "${ENFORCE_TESTS:-false}" = "true" ]; then
              return 1
            fi
            echo "::warning title=Testes falharam::Testes falharam, mas install/build passaram; o auto-merge seguira apenas com o build. Defina a variavel ENFORCE_TESTS=true no repo para bloquear."
          }

          for dir in . client server frontend backend web api; do
            if [ ! -f "$dir/package.json" ] && [ ! -f "$dir/requirements.txt" ] && [ ! -f "$dir/pyproject.toml" ]; then
              continue
            fi

            found=1
            echo "::group::Testing $dir"
            pushd "$dir" >/dev/null

            if [ -f package.json ]; then
              if [ -f pnpm-lock.yaml ]; then
                corepack enable
                pnpm install --frozen-lockfile
                PM=pnpm
              elif [ -f yarn.lock ]; then
                if [ -f .yarnrc.yml ]; then
                  corepack enable
                  yarn install --immutable
                else
                  yarn install --frozen-lockfile
                fi
                PM=yarn
              else
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install
                fi
                PM=npm
              fi

              has_build=$(node -e "const p=require('./package.json');process.stdout.write(p.scripts&&p.scripts.build?'yes':'no')")
              if [ "$has_build" = "yes" ]; then
                if [ "$PM" = "pnpm" ]; then pnpm run build
                elif [ "$PM" = "yarn" ]; then yarn run build
                else npm run build
                fi
              fi

              has_test=$(node -e "const p=require('./package.json');process.stdout.write(p.scripts&&p.scripts.test?'yes':'no')")
              if [ "$has_test" = "yes" ]; then
                test_script=$(node -e "const p=require('./package.json');process.stdout.write(p.scripts.test||'')")
                if echo "$test_script" | grep -qi "no test specified"; then
                  echo "No test script configured"
                elif echo "$test_script" | grep -qi "vitest"; then
                  if [ -x node_modules/.bin/vitest ]; then
                    run_optional_test npx vitest run
                  else
                    echo "vitest not installed; skipping tests"
                  fi
                elif echo "$test_script" | grep -Eqi "cypress|playwright"; then
                  echo "Skipping browser test: $test_script"
                elif echo "$test_script" | grep -Eqi "jest|react-scripts"; then
                  if [ -x node_modules/.bin/jest ] || [ -x node_modules/.bin/react-scripts ]; then
                    if [ "$PM" = "pnpm" ]; then run_optional_test env CI=true timeout 300 pnpm test -- --watchAll=false
                    elif [ "$PM" = "yarn" ]; then run_optional_test env CI=true timeout 300 yarn test -- --watchAll=false
                    else run_optional_test env CI=true timeout 300 npm test -- --watchAll=false
                    fi
                  else
                    echo "jest/react-scripts not installed; skipping tests"
                  fi
                else
                  if [ "$PM" = "pnpm" ]; then run_optional_test env CI=true timeout 300 pnpm test
                  elif [ "$PM" = "yarn" ]; then run_optional_test env CI=true timeout 300 yarn test
                  else run_optional_test env CI=true timeout 300 npm test
                  fi
                fi
              fi
            fi

            if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
              python -m pip install --upgrade pip
              if [ -f requirements.txt ]; then
                python -m pip install -r requirements.txt
              fi
              if [ -f pyproject.toml ]; then
                python -m pip install .
              fi
              if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
                python -m pip install pytest
                run_optional_test python -m pytest -q
              fi
            fi

            popd >/dev/null
            echo "::endgroup::"
          done

          if [ "$found" -eq 0 ]; then
            echo "No package manifests found; nothing to test."
          fi

  dependabot-auto-merge:
    name: dependabot-auto-merge
    needs: ci
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
